name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Rule 6 of AGENTS.md: on a pull request the guard comes from the base
      # branch, so the pull request cannot change the check that checks it.
      - name: Guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git show "origin/${GITHUB_BASE_REF}:ci/guard.sh" > ci/guard.sh
          fi
          sh ci/guard.sh
      - run: python3 -m unittest discover -s yantra -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --nocapture
