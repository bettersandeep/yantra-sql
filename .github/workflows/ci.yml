name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # A fast signal only. This file and this guard come from the pull request.
      # The guard that counts is in guard.yml, which GitHub takes from the base branch.
      - run: sh ci/guard.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --nocapture
