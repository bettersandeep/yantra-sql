name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # A fast signal only. This file and this guard come from the pull request.
      # The guard that counts is in guard.yml, which GitHub takes from the base branch.
      - run: sh ci/guard.sh
      # The tests of the runner. A change to yantra/ has no other check in CI.
      - run: python3 -m unittest discover -s yantra -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --nocapture
      # The tests of the demo site. site/wasm is a separate crate, so the commands above do not see it.
      - run: python3 -m unittest discover -s site -p 'test_*.py'
      - run: cargo fmt --check --manifest-path site/wasm/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path site/wasm/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path site/wasm/Cargo.toml
      # The server for the engine. It is a separate crate with its own lock file.
      - run: cargo fmt --check --manifest-path server/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
