name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The test data matches its checksums
        working-directory: tests/slt
        run: |
          sha256sum -c SHA256SUMS
          test "$(find . -name '*.test' | wc -l)" -eq "$(wc -l < SHA256SUMS)"
      - name: The crate has no dependencies
        run: test "$(grep -c '^\[\[package\]\]' Cargo.lock)" -eq 1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --nocapture
